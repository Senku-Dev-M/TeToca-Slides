<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>TeToca – Generar video de fondo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 24px;
    }
    h1 {
      font-size: 22px;
      color: #9AD9D6;
      letter-spacing: 0.5px;
    }
    canvas {
      border: 2px solid #008F8F44;
      border-radius: 8px;
      max-width: 90vw;
      max-height: 60vh;
    }
    .controls {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    button {
      padding: 10px 28px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    #btnRecord {
      background: #008F8F;
      color: white;
    }
    #btnRecord:hover { background: #17B5B6; }
    #btnRecord:disabled { background: #444; color: #888; cursor: not-allowed; }
    #btnStop {
      background: #cc3333;
      color: white;
    }
    #btnStop:hover { background: #ee4444; }
    #btnStop:disabled { background: #444; color: #888; cursor: not-allowed; }
    #status {
      font-size: 14px;
      color: #9AD9D6;
      min-height: 20px;
    }
    .settings {
      display: flex;
      gap: 20px;
      align-items: center;
      font-size: 14px;
    }
    .settings label { color: #9AD9D6; }
    .settings input, .settings select {
      background: #1a1a1a;
      border: 1px solid #008F8F44;
      color: #e0e0e0;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<h1>🎬 TeToca – Generador de video de fondo</h1>

<div class="settings">
  <label>Duración (s): <input type="number" id="duration" value="15" min="5" max="120" style="width:60px"></label>
  <label>Resolución:
    <select id="resolution">
      <option value="1920x1080" selected>1920×1080 (Full HD)</option>
      <option value="1280x720">1280×720 (HD)</option>
      <option value="3840x2160">3840×2160 (4K)</option>
    </select>
  </label>
  <label>FPS: <input type="number" id="fps" value="30" min="15" max="60" style="width:50px"></label>
</div>

<canvas id="canvas" width="1920" height="1080"></canvas>

<div class="controls">
  <button id="btnRecord">⏺ Grabar video</button>
  <button id="btnStop" disabled>⏹ Detener</button>
</div>
<p id="status">Previsualización en vivo. Presiona "Grabar video" para generar el .webm</p>

<script>
// ─── Configuración de colores TeToca ───────────────────────────
const BG_COLOR = '#F0F9F9';
const ICON_COLORS = [
  'rgba(0,143,143,0.18)',    // teal/20
  'rgba(255,196,42,0.22)',   // brand-yellow/25
  'rgba(23,181,182,0.13)',   // teal-bright/15
  'rgba(0,107,107,0.09)',    // teal-dark/10
];

// ─── Iconos SVG simplificados (paths de lucide-react) ──────────
const ICON_PATHS = [
  // Music
  (ctx, s) => {
    ctx.beginPath();
    ctx.arc(s*0.25, s*0.75, s*0.15, 0, Math.PI*2);
    ctx.arc(s*0.7, s*0.65, s*0.15, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(s*0.4, s*0.75); ctx.lineTo(s*0.4, s*0.15);
    ctx.moveTo(s*0.85, s*0.65); ctx.lineTo(s*0.85, s*0.1);
    ctx.moveTo(s*0.4, s*0.15); ctx.lineTo(s*0.85, s*0.1);
    ctx.stroke();
  },
  // Utensils (fork & knife)
  (ctx, s) => {
    ctx.beginPath();
    ctx.moveTo(s*0.3, s*0.1); ctx.lineTo(s*0.3, s*0.45);
    ctx.moveTo(s*0.2, s*0.1); ctx.lineTo(s*0.2, s*0.35);
    ctx.moveTo(s*0.4, s*0.1); ctx.lineTo(s*0.4, s*0.35);
    ctx.moveTo(s*0.2, s*0.35); ctx.lineTo(s*0.4, s*0.35);
    ctx.moveTo(s*0.3, s*0.45); ctx.lineTo(s*0.3, s*0.9);
    ctx.moveTo(s*0.7, s*0.1); ctx.quadraticCurveTo(s*0.85, s*0.4, s*0.7, s*0.55);
    ctx.lineTo(s*0.7, s*0.9);
    ctx.stroke();
  },
  // Hammer
  (ctx, s) => {
    ctx.beginPath();
    ctx.moveTo(s*0.35, s*0.65); ctx.lineTo(s*0.15, s*0.85);
    ctx.stroke();
    ctx.strokeRect(s*0.35, s*0.2, s*0.45, s*0.25);
    ctx.beginPath();
    ctx.moveTo(s*0.5, s*0.45); ctx.lineTo(s*0.35, s*0.65);
    ctx.stroke();
  },
  // GraduationCap
  (ctx, s) => {
    ctx.beginPath();
    ctx.moveTo(s*0.5, s*0.2); ctx.lineTo(s*0.9, s*0.4); ctx.lineTo(s*0.5, s*0.6);
    ctx.lineTo(s*0.1, s*0.4); ctx.closePath();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(s*0.25, s*0.48); ctx.lineTo(s*0.25, s*0.7);
    ctx.quadraticCurveTo(s*0.5, s*0.85, s*0.75, s*0.7);
    ctx.lineTo(s*0.75, s*0.48);
    ctx.stroke();
  },
  // Headphones
  (ctx, s) => {
    ctx.beginPath();
    ctx.arc(s*0.5, s*0.45, s*0.3, Math.PI, 0);
    ctx.stroke();
    ctx.fillRect(s*0.12, s*0.55, s*0.14, s*0.28);
    ctx.fillRect(s*0.74, s*0.55, s*0.14, s*0.28);
  },
  // Paintbrush
  (ctx, s) => {
    ctx.beginPath();
    ctx.moveTo(s*0.7, s*0.1); ctx.lineTo(s*0.35, s*0.5);
    ctx.quadraticCurveTo(s*0.2, s*0.55, s*0.25, s*0.7);
    ctx.quadraticCurveTo(s*0.15, s*0.85, s*0.3, s*0.85);
    ctx.quadraticCurveTo(s*0.4, s*0.75, s*0.45, s*0.55);
    ctx.lineTo(s*0.8, s*0.15);
    ctx.closePath();
    ctx.stroke();
  },
  // Star
  (ctx, s) => {
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = (i * 72 - 90) * Math.PI / 180;
      const r = s * 0.4;
      ctx.lineTo(s*0.5 + r * Math.cos(a), s*0.5 + r * Math.sin(a));
      const a2 = ((i * 72) + 36 - 90) * Math.PI / 180;
      const r2 = s * 0.18;
      ctx.lineTo(s*0.5 + r2 * Math.cos(a2), s*0.5 + r2 * Math.sin(a2));
    }
    ctx.closePath();
    ctx.stroke();
  },
  // Scissors
  (ctx, s) => {
    ctx.beginPath();
    ctx.arc(s*0.25, s*0.7, s*0.12, 0, Math.PI*2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(s*0.25, s*0.35, s*0.12, 0, Math.PI*2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(s*0.35, s*0.65); ctx.lineTo(s*0.8, s*0.25);
    ctx.moveTo(s*0.35, s*0.4); ctx.lineTo(s*0.8, s*0.75);
    ctx.stroke();
  },
  // Flower
  (ctx, s) => {
    for (let i = 0; i < 6; i++) {
      const a = (i * 60) * Math.PI / 180;
      ctx.beginPath();
      ctx.arc(s*0.5 + s*0.18*Math.cos(a), s*0.4 + s*0.18*Math.sin(a), s*0.1, 0, Math.PI*2);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(s*0.5, s*0.4, s*0.07, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(s*0.5, s*0.55); ctx.lineTo(s*0.5, s*0.9);
    ctx.stroke();
  },
  // Camera
  (ctx, s) => {
    ctx.strokeRect(s*0.1, s*0.3, s*0.8, s*0.5);
    ctx.beginPath();
    ctx.moveTo(s*0.3, s*0.3); ctx.lineTo(s*0.4, s*0.15);
    ctx.lineTo(s*0.6, s*0.15); ctx.lineTo(s*0.7, s*0.3);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(s*0.5, s*0.55, s*0.14, 0, Math.PI*2);
    ctx.stroke();
  },
  // Heart
  (ctx, s) => {
    ctx.beginPath();
    ctx.moveTo(s*0.5, s*0.85);
    ctx.bezierCurveTo(s*0.1, s*0.55, s*0.1, s*0.2, s*0.5, s*0.35);
    ctx.bezierCurveTo(s*0.9, s*0.2, s*0.9, s*0.55, s*0.5, s*0.85);
    ctx.stroke();
  },
  // Coins
  (ctx, s) => {
    ctx.beginPath();
    ctx.ellipse(s*0.4, s*0.55, s*0.25, s*0.2, 0, 0, Math.PI*2);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(s*0.6, s*0.45, s*0.25, s*0.2, 0, 0, Math.PI*2);
    ctx.stroke();
  },
];

// ─── Generar ítems flotantes (misma lógica que React) ──────────
function generateItems(count = 26) {
  // Use a seeded-like approach for reproducible random
  const items = [];
  for (let i = 0; i < count; i++) {
    const rand1 = ((i * 7919 + 104729) % 10000) / 10000; // pseudo-random
    const rand2 = ((i * 6271 + 73856) % 10000) / 10000;
    items.push({
      iconIndex: i % ICON_PATHS.length,
      color: ICON_COLORS[i % ICON_COLORS.length],
      size: 26 + rand1 * 42,
      topPercent: (i * 37) % 96,
      delay: -(i * 9 + rand2 * 14),
      duration: 70 + rand1 * 50,
      rotation: rand1 * 90 - 45,
    });
  }
  return items;
}

// ─── Canvas rendering ──────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const items = generateItems();

let tukiImg = new Image();
tukiImg.src = 'public/assets/tuki.png';
let tukiLoaded = false;
tukiImg.onload = () => { tukiLoaded = true; };
tukiImg.onerror = () => {
  // Try alternate path
  tukiImg.src = 'tetoca-presentation/public/assets/tuki.png';
  tukiImg.onload = () => { tukiLoaded = true; };
};

let startTime = performance.now();

function draw(timestamp) {
  const W = canvas.width;
  const H = canvas.height;
  const elapsed = (timestamp - startTime) / 1000; // seconds

  // Clear with background
  ctx.fillStyle = BG_COLOR;
  ctx.fillRect(0, 0, W, H);

  // Draw floating icons
  for (const item of items) {
    const totalDuration = item.duration;
    // Calculate x position: moves from -12% to 112% of width
    const t = ((elapsed - item.delay) % totalDuration + totalDuration) % totalDuration;
    const progress = t / totalDuration;
    const xStart = -0.12 * W;
    const xEnd = 1.12 * W;
    const x = xStart + progress * (xEnd - xStart);
    const y = (item.topPercent / 100) * H;

    // Scale icon to canvas
    const scale = W / 1920;
    const size = item.size * scale;

    // Rotation interpolation
    const rotation = item.rotation + progress * 40;

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotation * Math.PI / 180);

    // Set style
    ctx.fillStyle = item.color;
    ctx.strokeStyle = item.color;
    ctx.lineWidth = Math.max(1.5 * scale, 1);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // Draw icon
    ICON_PATHS[item.iconIndex](ctx, size);

    ctx.restore();
  }

  // Draw Tuki watermark
  if (tukiLoaded) {
    const scale = W / 1920;
    const tukiW = W * 0.20;
    const tukiH = tukiW * (tukiImg.naturalHeight / tukiImg.naturalWidth);
    const bobY = Math.sin(elapsed * (2 * Math.PI / 9)) * 12 * scale;
    
    ctx.save();
    ctx.globalAlpha = 0.05;
    ctx.filter = 'grayscale(100%)';
    ctx.drawImage(
      tukiImg,
      W - tukiW + W * 0.03,
      H - tukiH + H * 0.04 + bobY,
      tukiW,
      tukiH
    );
    ctx.filter = 'none';
    ctx.restore();
  }
}

// ─── Animation loop ────────────────────────────────────────────
let animId;
function loop(ts) {
  draw(ts);
  animId = requestAnimationFrame(loop);
}
loop(performance.now());

// ─── Recording ─────────────────────────────────────────────────
const btnRecord = document.getElementById('btnRecord');
const btnStop = document.getElementById('btnStop');
const status = document.getElementById('status');

let mediaRecorder = null;
let chunks = [];
let recordingTimeout = null;

btnRecord.addEventListener('click', () => {
  const durationSec = parseInt(document.getElementById('duration').value) || 15;
  const fps = parseInt(document.getElementById('fps').value) || 30;
  const [w, h] = document.getElementById('resolution').value.split('x').map(Number);

  // Resize canvas
  canvas.width = w;
  canvas.height = h;

  // Reset animation time
  startTime = performance.now();

  // Get stream
  const stream = canvas.captureStream(fps);

  // Try mp4 first (Safari), then webm
  const mimeTypes = [
    'video/mp4;codecs=avc1',
    'video/mp4',
    'video/webm;codecs=vp9',
    'video/webm;codecs=vp8',
    'video/webm',
  ];

  let selectedMime = '';
  for (const mime of mimeTypes) {
    if (MediaRecorder.isTypeSupported(mime)) {
      selectedMime = mime;
      break;
    }
  }

  if (!selectedMime) {
    status.textContent = '❌ Tu navegador no soporta grabación de video. Intenta con Chrome o Edge.';
    return;
  }

  chunks = [];
  mediaRecorder = new MediaRecorder(stream, {
    mimeType: selectedMime,
    videoBitsPerSecond: 8_000_000,
  });

  mediaRecorder.ondataavailable = (e) => {
    if (e.data.size > 0) chunks.push(e.data);
  };

  mediaRecorder.onstop = () => {
    const ext = selectedMime.includes('mp4') ? 'mp4' : 'webm';
    const blob = new Blob(chunks, { type: selectedMime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `tetoca-background-${w}x${h}.${ext}`;
    a.click();
    URL.revokeObjectURL(url);

    status.textContent = `✅ Video descargado: tetoca-background-${w}x${h}.${ext} (${(blob.size / 1024 / 1024).toFixed(1)} MB)`;
    btnRecord.disabled = false;
    btnStop.disabled = true;
  };

  mediaRecorder.start(1000); // collect data every second

  btnRecord.disabled = true;
  btnStop.disabled = false;
  status.textContent = `⏺ Grabando... (${durationSec}s en ${w}×${h} @ ${fps}fps) — formato: ${selectedMime}`;

  // Auto-stop after duration
  recordingTimeout = setTimeout(() => {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
    }
  }, durationSec * 1000);
});

btnStop.addEventListener('click', () => {
  clearTimeout(recordingTimeout);
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
  }
});
</script>
</body>
</html>
